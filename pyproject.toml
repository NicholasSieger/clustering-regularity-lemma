[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clustering-regularity"
version = "0.1.0"
description = "File-backed implementation and verifier for the clustering regularity lemma"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
clustering-regularity = "clustering_regularity.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-m", "not slow"]
testpaths = ["tests"]
markers = [
    "integration: multi-component algorithm tests",
    "slow: generated graph and timeout tests",
]
norecursedirs = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "artifacts",
    "runs",
]
